server:
  port: 8080

spring:
  application:
    name: activity-system
  # 本地私密配置（数据库密码、密钥）从 backend/ 目录的 application-local.yml 载入，
  # 该文件已被 .gitignore 忽略，不会提交/打包。复制 application-local.yml.example 填写即可。
  config:
    import: optional:file:./application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/activity_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 标准输出：改为仅开发环境打印，避免姓名/手机号进入 stdout
    log-impl: ${SQL_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted   # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义业务配置
activity:
  jwt:
    # 开发环境默认值（仅本地联调用）；生产必须用环境变量 JWT_SECRET 覆盖，长度 >= 32 字节
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-2026-activity}
    expire-hours: 12              # 管理员会话有效期
  checkin:
    # 动态二维码配置
    # 开发环境默认值；生产必须用环境变量 QR_SECRET 覆盖
    qr-secret: ${QR_SECRET:dev-only-qr-secret-please-change-2026-activity}
    qr-ttl-seconds: 30            # 动态二维码有效期(秒)，即刷新间隔
    open-before-minutes: 30       # 签到窗口：活动开始前 N 分钟
    # 宣传页/签到页的完整链接前缀。开发环境默认 localhost，生产用环境变量 PUBLIC_BASE_URL 覆盖
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
